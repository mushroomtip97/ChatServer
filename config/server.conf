[server]
port=8080
max_connections=1000
max_connections_per_ip=100
auth_timeout_seconds=30
idle_timeout_seconds=300
max_outbound_queue_bytes=1048576
max_incoming_frame_size=4194304
max_incoming_message_size=1048576

[database]
path=chat_server.db

[tls]
enabled=true
cert_path=certs/server.crt
key_path=certs/server.key
require_private_key_permissions=true

[logging]
level=info
file=chat_server.log

[health]
enabled=true
port=8081

[security]
auth_failure_limit=10
auth_ip_failure_limit=30
registration_rate_limit_per_minute=0
seed_demo_user=false
